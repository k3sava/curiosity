<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var t = localStorage.getItem('curiosity-theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}curiosity{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=20260407b">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a href="/" class="topbar-logo">curiosity</a>
    <nav class="topbar-nav">
      <a href="/library" class="topbar-link{% if active == 'library' %} active{% endif %}">Library</a>
      <a href="/spaces" class="topbar-link{% if active == 'spaces' %} active{% endif %}">Spaces</a>
      <a href="/review" class="topbar-link{% if active == 'review' %} active{% endif %}">Review</a>
      <a href="/gaps" class="topbar-link{% if active == 'discover' %} active{% endif %}">Discover</a>
    </nav>
    <button class="cmd-k-trigger" id="cmd-k-trigger">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="cmd-k-text">Save a link or search...</span>
      <kbd class="cmd-k-kbd">&#8984;K</kbd>
    </button>
  </header>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <!-- Cmd+K -->
  <div class="cmd-k-overlay" id="cmd-k-overlay">
    <div class="cmd-k-modal" id="cmd-k-modal">
      <div class="cmd-k-input-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="cmd-k-input" id="cmd-k-input" placeholder="Save a link or search..." autocomplete="off" autofocus>
      </div>
      <div class="cmd-k-results" id="cmd-k-results">
        <div class="cmd-k-section">
          <div class="cmd-k-section-label">Commands</div>
          <a href="/import" class="cmd-k-item" data-action="navigate">Import bookmarks</a>
          <a href="/rules" class="cmd-k-item" data-action="navigate">Automation rules</a>
          <a href="/health" class="cmd-k-item" data-action="navigate">Broken links</a>
          <a href="/settings" class="cmd-k-item" data-action="navigate">Settings</a>
          <button class="cmd-k-item" data-action="toggle-theme">Toggle dark mode</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/cmd-k.js"></script>
  <script>
    (function() {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function() {
        var html = document.documentElement;
        var isDark = html.getAttribute('data-theme') === 'dark';
        if (isDark) { html.removeAttribute('data-theme'); localStorage.setItem('curiosity-theme', 'light'); }
        else { html.setAttribute('data-theme', 'dark'); localStorage.setItem('curiosity-theme', 'dark'); }
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
